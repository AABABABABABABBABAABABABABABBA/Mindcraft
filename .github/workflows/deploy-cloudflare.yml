name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - claude/eaglercraft-multiplayer-optimize-wkf3lw
    paths:
      - "stable-download/web/**"
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MC_SERVER: ${{ vars.MC_SERVER }}
      TURN_KEY_ID: ${{ vars.TURN_KEY_ID }}
      TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
    steps:
      - name: Check for Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN secret is not set, skipping deploy"

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          sparse-checkout: |
            cloudflare
            stable-download/web

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22

      - name: Install wrangler
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: cloudflare
        run: npm ci

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: cloudflare
        run: |
          ARGS=""
          if [ -n "$MC_SERVER" ]; then ARGS="$ARGS --var MC_SERVER:$MC_SERVER"; fi
          if [ -n "$TURN_KEY_ID" ]; then ARGS="$ARGS --var TURN_KEY_ID:$TURN_KEY_ID"; fi
          npx wrangler deploy $ARGS

      - name: Set TURN secret
        if: env.CLOUDFLARE_API_TOKEN != '' && env.TURN_KEY_API_TOKEN != ''
        working-directory: cloudflare
        run: printf '%s' "$TURN_KEY_API_TOKEN" | npx wrangler secret put TURN_KEY_API_TOKEN
